spring.application.name=supplier-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/erp_supplier_db
spring.datasource.username=root
spring.datasource.password=root123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

services.organization.base-url=http://localhost:8081

spring.http.clients.connect-timeout=1s
spring.http.clients.read-timeout=3s

resilience4j.circuitbreaker.instances.organizationService.sliding-window-size=10
resilience4j.circuitbreaker.instances.organizationService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.organizationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.organizationService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.organizationService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.organizationService.record-exceptions=com.erp.supplier_service.exception.OrganizationServiceUnavailableException
resilience4j.circuitbreaker.instances.organizationService.ignore-exceptions[0]=com.erp.supplier_service.exception.OrganizationReferenceNotFoundException
resilience4j.circuitbreaker.instances.organizationService.ignore-exceptions[1]=com.erp.supplier_service.exception.OrganizationServiceResponseException